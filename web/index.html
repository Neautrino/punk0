<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>punk0</title>
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- Left: projects and their workspaces -->
  <aside id="pane-projects">
    <header class="pane-head">
      <span class="head-title">Projects</span>
      <button id="btn-add-project" class="icon-btn" type="button" title="Add project">+</button>
    </header>
    <div id="projects-list"></div>
    <div id="side-form" class="hidden">
      <input id="form-name" type="text" spellcheck="false" autocomplete="off" />
      <label id="form-wt-row" class="hidden"><input id="form-wt" type="checkbox" /> Own worktree and branch</label>
      <input id="form-base" class="hidden" type="text" placeholder="base branch (default: HEAD)" spellcheck="false" autocomplete="off" />
      <div class="form-actions">
        <button id="form-cancel" type="button">Cancel</button>
        <button id="form-submit" type="button">Create</button>
      </div>
    </div>
  </aside>

  <!-- Middle: the selected workspace's tabs, terminals and files alike -->
  <section id="pane-center" class="pane">
    <header class="pane-head" id="tab-head">
      <div id="tabs"></div>
      <button id="btn-new-tab" class="icon-btn" type="button" title="New tab" aria-haspopup="menu">+</button>
    </header>
    <div id="new-tab-menu" class="menu hidden" role="menu">
      <button type="button" role="menuitem" data-new-tab="claude"><span class="menu-kind claude">✳</span>Claude Code</button>
      <button type="button" role="menuitem" data-new-tab="shell"><span class="menu-kind">$</span>Shell</button>
      <button type="button" role="menuitem" data-new-tab="file"><span class="menu-kind file"></span>Open file…</button>
    </div>
    <div id="term" class="hidden"></div>
    <main id="viewer" class="hidden">
      <header id="view-head">
        <span id="file-title"></span>
        <span class="file-meta" id="file-meta"></span>
      </header>
      <div id="code-vp">
        <div id="code-sizer">
          <div id="code-rows"></div>
        </div>
      </div>
    </main>
    <div id="center-empty" class="hidden">
      <p>No tabs open.</p>
      <p class="hint">Use <b>+</b> to start Claude Code or a shell, or pick a file on the right.</p>
    </div>
    <div id="picker" class="hidden">
      <div id="picker-box">
        <input id="picker-input" type="text" placeholder="Open file by name" spellcheck="false" autocomplete="off" />
        <div id="picker-list"></div>
      </div>
    </div>
  </section>

  <!-- Right: the selected workspace's files -->
  <aside id="pane-files">
    <header class="pane-head">
      <span class="head-title" id="files-root"></span>
      <button id="btn-collapse" class="icon-btn" type="button" title="Collapse all folders">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 20 5-5 5 5"/><path d="m7 4 5 5 5-5"/></svg>
      </button>
    </header>
    <div id="tree"></div>
    <footer id="files-foot" class="hidden">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7"/><path d="M18 10.5c0 4-6 3-11 5.5"/></svg>
      <span id="files-branch"></span>
    </footer>
  </aside>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
