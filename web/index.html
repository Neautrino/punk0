<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>punk0</title>
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- Left Sidebar: Projects and their workspaces -->
  <aside id="pane-projects">
    <header class="pane-head">
      <span class="head-title">Projects</span>
      <button id="btn-add-project" class="icon-btn" type="button" title="Add project">+</button>
    </header>
    <div id="projects-list"></div>
    <div id="side-form" class="hidden">
      <input id="form-name" type="text" spellcheck="false" autocomplete="off" />
      <label id="form-wt-row" class="hidden"><input id="form-wt" type="checkbox" /> Own worktree and branch</label>
      <input id="form-base" class="hidden" type="text" placeholder="base branch (default: HEAD)" spellcheck="false" autocomplete="off" />
      <div class="form-actions">
        <button id="form-cancel" type="button">Cancel</button>
        <button id="form-submit" type="button">Create</button>
      </div>
    </div>
  </aside>

  <!-- Middle Pane: Terminal (Shell + Claude Launcher) -->
  <section id="pane-term" class="pane">
    <header class="pane-head">
      <div class="head-left">
        <button id="btn-claude" type="button" title="Start Claude Code in this shell">Claude</button>
        <span class="head-title">Terminal</span>
      </div>
    </header>
    <div id="term"></div>
  </section>

  <!-- Split Divider -->
  <div id="resizer" aria-hidden="true"></div>

  <!-- Right Pane: Code Explorer & Viewer -->
  <section id="pane-view" class="pane">
    <aside id="sidebar">
      <header class="pane-head">
        <span class="head-title">Files</span>
      </header>
      <div id="tree"></div>
    </aside>

    <main id="viewer">
      <header class="pane-head" id="view-head">
        <span class="head-title" id="file-title">Select a file</span>
        <span class="file-meta" id="file-meta"></span>
      </header>
      <div id="code-vp">
        <div id="code-sizer">
          <div id="code-rows"></div>
        </div>
      </div>
    </main>
  </section>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
